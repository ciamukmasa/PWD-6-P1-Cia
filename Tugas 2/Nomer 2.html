<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Mahasiswa</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 30px;
        }

        h1 {
            font-size: 32px;
        }

        fieldset {
            margin-bottom: 12px;
            padding: 15px;
        }

        .baris {
            margin: 8px 0;
        }

        .label {
            display: inline-block;
            width: 220px;
        }

        input[type="text"] {
            width: 190px;
        }

        textarea {
            width: 200px;
            height: 100px;
            vertical-align: top;
        }
    </style>
</head>

<body>

<h1>Form Mahasiswa</h1>

<form>
    <fieldset>
        <legend>Data Mahasiswa</legend>

        <div class="baris">
            <label class="label" for="nama">Nama</label>:
            <input type="text" id="nama" name="nama">
        </div>

        <div class="baris">
            <label class="label" for="npm">NPM</label>:
            <input type="text" id="npm" name="npm">
        </div>

        <div class="baris">
            <label class="label" for="kelas">Kelas</label>:
            <select id="kelas" name="kelas">
                <option value="">Pilih kelas</option>
                <option>A</option>
                <option>B</option>
                <option>C</option>
            </select>
        </div>

        <div class="baris">
            <span class="label">Jenis Kelamin</span>:
            <input type="radio" name="jk" value="Pria">Pria
            <input type="radio" name="jk" value="Wanita">Wanita
        </div>
    </fieldset>

    <fieldset>
        <legend>Tempat Tinggal Mahasiswa</legend>

        <div class="baris">
            <label class="label" for="alamat">Alamat</label>:
            <textarea id="alamat" name="alamat"></textarea>
        </div>

        <div class="baris">
            <label class="label" for="kecamatan">Kecamatan</label>:
            <input type="text" id="kecamatan" name="kecamatan">
        </div>

        <div class="baris">
            <label class="label" for="kabupaten">
                Kabupaten/Kotamadya
            </label>:
            <input type="text" id="kabupaten" name="kabupaten">
        </div>

        <div class="baris">
            <label class="label" for="provinsi">Provinsi</label>:
            <input type="text" id="provinsi" name="provinsi">
        </div>

        <div class="baris">
            <label class="label" for="kodepos">Kode Pos</label>:
            <input type="text" id="kodepos" name="kodepos">
        </div>
    </fieldset>

    <fieldset>
        <legend>Lain-lainnya</legend>

        <div class="baris">
            <span class="label">Bahasa Pemrograman</span>:

            <input type="checkbox" name="bahasa" value="C/C++">C/C++
            <input type="checkbox" name="bahasa" value="Go Lang">Go Lang
            <input type="checkbox" name="bahasa" value="Python">Python
            <input type="checkbox" name="bahasa" value="Lainnya">Lainnya

            <br><br>

            <span class="label"></span>
            <input type="checkbox" name="bahasa" value="PHP">PHP
            <input type="checkbox" name="bahasa" value="Javascript">Javascript
            <input type="checkbox" name="bahasa" value="Ruby">Ruby
        </div>

        <div class="baris">
            <span class="label">Kegiatan</span>:

            <input type="checkbox" name="kegiatan" value="Organisasi Kemahasiswaan">
            Organisasi Kemahasiswaan

            <input type="checkbox" name="kegiatan" value="Bidang Olahraga">
            Bidang Olahraga

            <input type="checkbox" name="kegiatan" value="Lainnya">
            Lainnya

            <br><br>

            <span class="label"></span>
            <input type="checkbox" name="kegiatan" value="Organisasi di Luar Kampus">
            Organisasi di Luar Kampus

            <input type="checkbox" name="kegiatan" value="Bidang Seni">
            Bidang Seni
        </div>
    </fieldset>

    <button type="reset">Reset</button>
    <button type="submit">Submit</button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Absensi Mahasiswa</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 30px;
        }

        .container {
            border: 2px solid black;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 32px; 
        }

        table {
            border-collapse: collapse;
            width: 90%;
            margin: auto;
            text-align: center;
        }

        th, td {
            border: 2px solid #aaa;
            padding: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Absensi Mahasiswa Teknik Informatika</h1>

    <table>
        <tr>
            <th rowspan="3">NO</th>
            <th rowspan="3">NPM</th>
            <th rowspan="3">NAMA</th>
            <th colspan="7">PERTEMUAN</th>
        </tr>

        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
        </tr>

        <tr>
            <th>9-Feb</th>
            <th>16-Feb</th>
            <th>23-Feb</th>
            <th>2-Mar</th>
            <th>9-Mar</th>
            <th>16-Mar</th>
            <th>23-Mar</th>
        </tr>

        <tr>
            <td>1</td>
            <td>12345678</td>
            <td>Cia Imut</td>
            <td>v</td>
            <td></td><td></td><td></td>
            <td></td><td></td><td></td>
        </tr>

        <tr>
            <td>2</td>
            <td>87654321</td>
            <td>Cia Cantik</td>
            <td>v</td>
            <td></td><td></td><td></td>
            <td></td><td></td><td></td>
        </tr>

        <tr>
            <td>3</td>
            <td>23456789</td>
            <td>Cia Baik</td>
            <td>v</td>
            <td></td><td></td><td></td>
            <td></td><td></td><td></td>
        </tr>
    </table>
</div>

</body>
</html>
